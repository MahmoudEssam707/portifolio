<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f7fb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Pre-paint: theme (no flash) and the JS flag for reveal styles.
      (function () {
        var d = document.documentElement;
        d.classList.add("js");
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        d.setAttribute("data-theme", theme);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f7f7fb" : "#07080c");
        // Failsafe: if the app never boots, drop the JS-only hidden states.
        setTimeout(function () {
          if (!window.__booted) {
            d.classList.remove("js");
          }
        }, 4000);
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
